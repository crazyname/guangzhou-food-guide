name: Test local Xiaohongshu collector
on:
  push:
    paths:
      - "tools/xhs_collector.py"
      - "tests/test_xhs_collector.py"
      - "requirements.txt"
      - ".github/workflows/test-collector.yml"
  pull_request:
    paths:
      - "tools/xhs_collector.py"
      - "tests/test_xhs_collector.py"
      - "requirements.txt"
      - ".github/workflows/test-collector.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Compile and run offline tests
        run: |
          python -m py_compile tools/xhs_collector.py
          python -m unittest discover -s tests -v
